<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Calculator</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="https://homecostcalculator.in/assets/img/logo-mark.svg">
            <p class="name">HOUSE COST CALCULATOR</p>
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="material.html">Material</a></li>
            <li><a href="cost.html">Calculator</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="lan">
           <a href="cart"><i class="fa-solid fa-basket-shopping"></i></a> 
        </div>
        <button class="btn1"><a href="login.html">Login</a></button>
    </nav>
    <main>
        <div class="left">
            <h2>Your Items</h2>
            <hr>
        </div>
        <div class="right">
            <h2>Cart Quantity</h2>
            <hr>
            <button onclick = "document.write(`Cart Quantity:${cartQuantity}`)">Show Quantity</button>
            <button onclick = "cartQuantity = cartQuantity + 1;
                document.write(`Cart Quantity:${cartQuantity}`)">Add Quantity</button>
            <button onclick="
                cartQuantity = cartQuantity + 2;
                document.write(`Cart Quantity:${cartQuantity}`)">+2</button>
            <button onclick="cartQuantity = cartQuantity + 3;
                document.write(`Cart Quantity:${cartQuantity}`)">+3</button>
            <button onclick="
                cartQuantity = 0;
                document.write(`Cart Quantity:${cartQuantity}`)"
                >Reset Cart</button>
        </div>
    </main>
    <script>
        let cartQuantity = 0;
    </script>
</body>
</html>
